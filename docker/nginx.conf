# 두 포트를 동시에 열어 arm 전환에 nginx 재시작이 필요 없게
#   8090 -> 앱 1대   (N1, N1-20)
#   8091 -> 앱 2대   (N2)
#
# 라운드로빈(기본)
# 모체가 Nginx RR 을 쓰므로 맞춤

worker_processes auto;

events {
    # 20,000 동시 연결
    worker_connections 32768;
}

http {
    access_log off;

    upstream app_single {
        server host.docker.internal:8080;
        # keepalive 없으면 요청마다 새 커넥션을 열어 nginx 쪽 포트가 고갈된다
        keepalive 256;
    }

    upstream app_pair {
        server host.docker.internal:8080;
        server host.docker.internal:8082;
        keepalive 256;
    }

    server {
        listen 80 backlog=20000;
        location / {
            proxy_pass http://app_single;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }
    }

    server {
        listen 81 backlog=20000;
        location / {
            proxy_pass http://app_pair;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }
    }
}
